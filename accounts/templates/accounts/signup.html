{% extends "base.html" %} {% block content %}

<style>
  .signup-page {
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f3f4f6;
  }

  .signup-card {
    width: 420px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
  }

  .signup-card h2 {
    text-align: center;
    margin-bottom: 8px;
    color: #1f2937;
  }

  .signup-card .subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
  }

  .signup-form p {
    margin-bottom: 18px;
  }

  .signup-form label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    color: #374151;
  }

  .signup-form input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 15px;
  }

  .signup-form input:focus {
    outline: none;
    border-color: #2563eb;
  }

  .errorlist {
    color: #dc2626;
    font-size: 14px;
    margin: 5px 0;
    padding-left: 18px;
  }

  .signup-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  .signup-button:hover {
    background: #1d4ed8;
  }

  .login-link {
    text-align: center;
    margin-top: 20px;
    color: #6b7280;
  }

  .login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }

  .login-link a:hover {
    text-decoration: underline;
  }
</style>

<div class="signup-page">
  <div class="signup-card">
    <h2>Create Account</h2>

    <p class="subtitle">Create your InvoiceApp account</p>

    <form method="POST" class="signup-form">
      {% csrf_token %} {{ form.as_p }}

      <button type="submit" class="signup-button">Sign Up</button>
    </form>

    <div class="login-link">
      Already have an account?
      <a href="{% url 'login' %}">Login</a>
    </div>
  </div>
</div>

{% endblock %}
